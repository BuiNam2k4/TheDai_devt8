version: '3.8'

services:
  # 1. RabbitMQ (Hàng đợi xử lý chấm điểm & tác vụ nền)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hanoiprep_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - hanoiprep-net

  # 2. Backend Spring Boot
  backend:
    build: ./hanoiprep_backend
    container_name: hanoiprep_backend
    ports:
      - "8080:8080"
    env_file:
      - ./hanoiprep_backend/.env
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - hanoiprep-net

  # 3. Frontend React (Vite + Nginx)
  frontend:
    build: ./hanoiprep_frontend
    container_name: hanoiprep_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - hanoiprep-net

volumes:
  rabbitmq_data:

networks:
  hanoiprep-net:
    driver: bridge
